name: Web checks
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schengen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schengen_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schengen_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schengen_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:db
      - run: pnpm build
      - run: pnpm --filter @schengen/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
